[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filecmd"
version = "1.0.0"
description = "Object-oriented, command-driven virtual file system with undo/redo"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

[tool.setuptools.packages.find]
where = ["src"]
